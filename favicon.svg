<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @font-face {
        font-family: 'Courier New', monospace;
      }
      .favicon-text {
        font-family: 'Courier New', monospace;
        font-weight: bold;
        font-size: 60px;
        letter-spacing: 2px;
        fill: #c9a84c;
        text-anchor: middle;
      }
      .favicon-accent {
        fill: #00ff41;
      }
    </style>
  </defs>

  <!-- Black background -->
  <rect width="100" height="100" fill="#000000"/>

  <!-- Outer glitch border -->
  <rect x="8" y="8" width="84" height="84" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>

  <!-- Inner tech accent -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>

  <!-- Main text: LB -->
  <text x="50" y="62" class="favicon-text">LB</text>

  <!-- Top accent line - gold -->
  <line x1="15" y1="28" x2="35" y2="28" stroke="#c9a84c" stroke-width="2" opacity="0.8"/>

  <!-- Bottom accent line - neon green -->
  <line x1="65" y1="72" x2="85" y2="72" stroke="#00ff41" stroke-width="2" opacity="0.8" stroke-linecap="round"/>

  <!-- Small corner brackets for tech vibe -->
  <g stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.7">
    <!-- Top left bracket -->
    <path d="M 15 15 L 15 25 L 25 25"/>
    <!-- Bottom right bracket -->
    <path d="M 75 75 L 85 75 L 85 85"/>
  </g>

  <!-- Subtle scan line effect -->
  <line x1="10" y1="50" x2="90" y2="50" stroke="#00ff41" stroke-width="0.5" opacity="0.2"/>
  <line x1="10" y1="52" x2="90" y2="52" stroke="#00ff41" stroke-width="0.5" opacity="0.2"/>
</svg>
