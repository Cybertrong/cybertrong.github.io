  <script>
    // Accueil : une combinaison de couleurs au hasard, jamais deux fois la même de suite
    (function () {
      var P = ['blue-cream','cream-blue','white-blue','blue-white','gold-blue','blue-gold','cream-red','red-cream','cream-ochre'];
      var BG = {'blue-cream':'#2A58A8','cream-blue':'#ECE7E2','white-blue':'#FFFFFF','blue-white':'#2A58A8','gold-blue':'#E2B04A','blue-gold':'#2A58A8','cream-red':'#ECE7E2','red-cream':'#D35035','cream-ochre':'#ECE7E2'};
      var last = null;
      try { last = sessionStorage.getItem('linh-palette'); } catch (e) {}
      var pick;
      do { pick = P[Math.floor(Math.random() * P.length)]; } while (pick === last);
      try { sessionStorage.setItem('linh-palette', pick); } catch (e) {}
      document.documentElement.setAttribute('data-palette', pick);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', BG[pick]);
    })();
  </script>
