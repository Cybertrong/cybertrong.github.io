<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIC - Portfolio Mockup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }

        .mockup-container {
            position: relative;
            width: 100%;
            max-width: 1024px;
            aspect-ratio: 1024/768;
        }

        .mac-frame {
            position: relative;
            width: 100%;
            height: 100%;
            background: url('mac-computer-screen-png-pin-screen-clipart-mac-computer-2-1024.png') center/contain no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen-content {
            position: absolute;
            top: 2.8%;
            left: 2.2%;
            width: 95.6%;
            height: 83.5%;
            background: white;
            border-radius: 3px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .controls {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .controls button {
            background: #000;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #333;
        }

        .fullscreen-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 9999;
        }

        .fullscreen-view.active {
            display: flex;
            flex-direction: column;
        }

        .fullscreen-view iframe {
            flex: 1;
        }

        .fullscreen-close {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #000;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            z-index: 10000;
        }

        .fullscreen-close:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <div class="mockup-container">
        <div class="mac-frame">
            <div class="screen-content">
                <iframe src="VIC/index.html"></iframe>
            </div>
        </div>
        <div class="controls">
            <button onclick="toggleFullscreen()">View Fullscreen</button>
        </div>
    </div>

    <div class="fullscreen-view" id="fullscreenView">
        <button class="fullscreen-close" onclick="closeFullscreen()">✕</button>
        <iframe src="VIC/index.html"></iframe>
    </div>

    <script>
        function toggleFullscreen() {
            document.getElementById('fullscreenView').classList.add('active');
        }

        function closeFullscreen() {
            document.getElementById('fullscreenView').classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeFullscreen();
        });
    </script>
</body>
</html>
