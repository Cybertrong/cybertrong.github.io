<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Modular Commercial Furniture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-light: #fffcfc;
            --bg-white: #fff0e7;
            --text-dark: #3a3a3a;
            --border-light: #e0e0e0;
            --accent: #083335;
        }

        html {
            scroll-behavior: smooth;
        }

        @keyframes flipLetters {
            0% {
                opacity: 0;
                transform: scaleY(0);
            }
            100% {
                opacity: 1;
                transform: scaleY(1);
            }
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: #ffffff;
            backdrop-filter: blur(8px);
            height: 70px;
            padding: 0 6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: none;
            transition: background 0.3s ease;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.18rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            color: var(--text-dark);
            position: fixed;
            right: 3rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0;
        }

        .logo span {
            opacity: 0;
            display: inline-block;
            animation: flipLetters 0.6s cubic-bezier(0.33, 0.66, 0.66, 1) forwards;
        }

        .logo span:nth-child(1) { animation-delay: 0s; }
        .logo span:nth-child(2) { animation-delay: 0.1s; }
        .logo span:nth-child(3) { animation-delay: 0.2s; }
        .logo span:nth-child(4) { animation-delay: 0.3s; }
        .logo span:nth-child(5) { animation-delay: 0.4s; }
        .logo span:nth-child(6) { animation-delay: 0.5s; }
        .logo span:nth-child(7) { animation-delay: 0.6s; }
        .logo span:nth-child(8) { animation-delay: 0.7s; }
        .logo span:nth-child(9) { animation-delay: 0.8s; }
        .logo span:nth-child(10) { animation-delay: 0.9s; }
        .logo span:nth-child(11) { animation-delay: 1s; }
        .logo span:nth-child(12) { animation-delay: 1.1s; }
        .logo span:nth-child(13) { animation-delay: 1.2s; }
        .logo span:nth-child(14) { animation-delay: 1.3s; }
        .logo span:nth-child(15) { animation-delay: 1.4s; }
        .logo span:nth-child(16) { animation-delay: 1.5s; }
        .logo span:nth-child(17) { animation-delay: 1.6s; }
        .logo span:nth-child(18) { animation-delay: 1.7s; }
        .logo span:nth-child(19) { animation-delay: 1.8s; }
        .logo span:nth-child(20) { animation-delay: 1.9s; }
        .logo span:nth-child(21) { animation-delay: 2s; }
        .logo span:nth-child(22) { animation-delay: 2.1s; }
        .logo span:nth-child(23) { animation-delay: 2.2s; }
        .logo span:nth-child(24) { animation-delay: 2.3s; }
        .logo span:nth-child(25) { animation-delay: 2.4s; }
        .logo span:nth-child(26) { animation-delay: 2.5s; }

        .logo:hover span {
            opacity: 0.6;
        }

        .burger {
            width: 50px;
            height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            top: 10px;
            z-index: 1001;
        }

        .burger span {
            width: 38px;
            height: 2px;
            background-color: var(--text-dark);
            transition: all 0.4s cubic-bezier(0.33, 0.66, 0.66, 1);
            position: relative;
        }

        .burger:hover span {
            background-color: var(--text-dark);
            height: 2.5px;
        }

        .burger.active span:nth-child(1) {
            transform: rotate(45deg) translate(13px, 13px) scaleX(1.15);
            width: 38px;
            height: 2.5px;
            background-color: #3a3a3a;
        }

        .burger.active span:nth-child(2) {
            opacity: 0;
            width: 0;
            transform: scale(0.8);
            background-color: #3a3a3a;
        }

        .burger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(12px, -12px) scaleX(1.15);
            width: 38px;
            height: 2.5px;
            background-color: #3a3a3a;
        }

        .menu-modal {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 35%;
            height: calc(100vh - 70px);
            background: #083335;
            z-index: 999;
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.33, 0.66, 0.66, 1);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            border-radius: 0 0 0 30px;
            padding-left: 3rem;
            border-left: 12px solid #99430e;
        }

        @media (max-width: 1024px) {
            .menu-modal {
                width: 50%;
            }
        }

        @media (max-width: 768px) {
            .menu-modal {
                width: 65%;
            }

            .menu-content a {
                font-size: 2rem;
            }

            .menu-modal {
                padding-left: 2rem;
            }

            .menu-content {
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .menu-modal {
                width: 85%;
            }

            .menu-content a {
                font-size: 1.8rem;
            }
        }

        .menu-modal.active {
            transform: translateX(0);
        }

        .menu-modal.active .menu-content a {
            font-size: 2.25rem;
        }

        .menu-content {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            text-align: left;
        }

        .menu-content a {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.8rem;
            font-weight: 200;
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
            line-height: 1.1;
        }

        .menu-content a:hover {
            color: #99430e;
        }

        .language-switcher {
            display: flex;
            gap: 1rem;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .language-switcher a {
            font-size: 1.2rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .language-switcher a.active {
            background: #99430e;
            color: #ffffff;
        }

        .language-switcher a:hover {
            background: rgba(153, 67, 14, 0.5);
        }

        .menu-footer {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            right: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--bg-light);
            opacity: 0.6;
        }

        .menu-footer a {
            color: var(--bg-light);
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .menu-footer a:hover {
            opacity: 1;
        }

        /* MOBILE LOGO BAR */
        .mobile-logo-bar {
            display: none;
            background: #083335;
            padding: 1rem;
            text-align: center;
            position: relative;
            z-index: 999;
            margin-top: 50px;
        }

        .mobile-logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.26rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            color: #ffffff;
        }

        main {
            margin-top: 70px;
            min-height: calc(100vh - 70px);
            padding: 6rem 3rem;
            position: relative;
            overflow: hidden;
        }

        main::before {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,50 Q300,30 600,50 T1200,50 L1200,120 L0,120 Z" fill="%23ecd2ae" opacity="0.15"/></svg>') repeat-x;
            animation: waveAnimation 6s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        main::after {
            content: '';
            position: absolute;
            bottom: 55%;
            left: 0;
            right: 0;
            height: 400px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,50 Q300,30 600,50 T1200,50 L1200,120 L0,120 Z" fill="%23fffcfc" opacity="0.08"/></svg>') repeat-x;
            animation: waveAnimation 6s linear infinite reverse;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes waveAnimation {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 600px 0;
            }
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 8.58rem;
            font-weight: 300;
            line-height: 0.7;
            margin-bottom: 2rem;
            color: #99430e;
            letter-spacing: -2px;
        }

        .contact-intro {
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 4rem;
            font-weight: 300;
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: 2rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            border: 1px solid var(--border-light);
            background: #ffffff;
            color: var(--text-dark);
            transition: all 0.3s ease;
            border-radius: 20px;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(236, 210, 174, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 180px;
            font-family: 'Inter', sans-serif;
        }

        .submit-btn {
            margin-top: 3rem;
            padding: 1rem 2rem;
            background: #3a3a3a;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.33, 0.66, 0.66, 1);
        }

        .submit-btn:hover {
            background: var(--accent);
            color: #3a3a3a;
            transform: translateY(-2px);
        }

        footer {
            padding: 1rem 3rem;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        footer a {
            display: none;
            color: #afafaf;
            text-decoration: none;
            margin: 0 0.5rem;
            transition: opacity 0.3s ease;
        }

        footer a:hover {
            opacity: 0.6;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 1024px) {
            main {
                padding: 4rem 3rem;
            }

            h1 {
                font-size: 4rem;
            }

            .container {
                max-width: 600px;
            }
        }

        @media (max-width: 768px) {
            .mobile-logo-bar {
                display: block;
            }

            header {
                padding: 0 2rem;
                height: 60px;
            }

            .logo {
                display: none;
            }

            .burger {
                width: 40px;
                height: 40px;
                gap: 2px;
            }

            .burger span {
                width: 30px;
            }

            .menu-modal {
                width: 100%;
                height: calc(100vh - 60px);
                border-radius: 0;
                border-left: none;
            }

            .menu-content a {
                font-size: 1.76rem;
            }

            h1 {
                font-size: 1.41rem;
                line-height: 1.1;
                margin-bottom: 1.5rem;
            }

            main {
                margin-top: 120px;
                padding: 2rem 1.5rem;
            }

            .container {
                max-width: 100%;
            }

            .contact-intro {
                font-size: 0.95rem;
                line-height: 1.6;
                margin-bottom: 2rem;
            }

            label {
                font-size: 0.85rem;
                margin-bottom: 0.6rem;
            }

            input[type="text"],
            input[type="email"],
            input[type="tel"],
            textarea {
                padding: 0.9rem;
                font-size: 0.95rem;
                border-radius: 15px;
            }

            .form-group {
                margin-bottom: 1.2rem;
            }

            .submit-btn {
                padding: 0.8rem 1.2rem;
                font-size: 0.85rem;
                margin-top: 1.5rem;
                border-radius: 15px;
            }

            footer {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
                padding: 1.2rem 1.5rem;
                font-size: 0.8rem;
            }

            footer a {
                display: none;
                margin: 0;
            }

            /* Adjust form grid for smaller screens */
            #contactForm > div {
                display: grid !important;
                grid-template-columns: 1fr !important;
            }
        }

        @media (max-width: 480px) {
            .mobile-logo-bar {
                display: block;
                padding: 0.8rem;
            }

            .mobile-logo-text {
                font-size: 1.05rem;
            }

            header {
                padding: 0 1rem;
                height: 50px;
            }

            .logo {
                display: none;
            }

            .burger {
                width: 35px;
                height: 35px;
                gap: 2px;
                top: 7px;
            }

            .menu-modal {
                width: 100%;
                height: calc(100vh - 50px);
            }

            .menu-content a {
                font-size: 1.41rem;
            }

            h1 {
                font-size: 2rem;
                line-height: 1.1;
                margin-bottom: 1.2rem;
            }

            main {
                margin-top: 95px;
                padding: 1.2rem 1rem;
            }

            .container {
                max-width: 100%;
            }

            .contact-intro {
                font-size: 0.9rem;
                line-height: 1.5;
                margin-bottom: 1.5rem;
            }

            input[type="text"],
            input[type="email"],
            input[type="tel"],
            textarea {
                padding: 0.85rem;
                font-size: 0.95rem;
                border-radius: 12px;
            }

            .form-group {
                margin-bottom: 1rem;
            }

            .submit-btn {
                padding: 0.7rem 1rem;
                font-size: 0.8rem;
                margin-top: 1.2rem;
                border-radius: 12px;
            }

            footer {
                padding: 0.8rem;
                font-size: 0.7rem;
            }

            footer a {
                display: none;
            }

            label {
                font-size: 0.8rem;
                margin-bottom: 0.5rem;
            }
        }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/index.min.js"></script>
</head>
<body>

    <header>
        <div class="burger" id="burger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="logo" id="logo"><span>M</span><span>O</span><span>D</span><span>U</span><span>L</span><span>A</span><span>R</span><span> </span><span>C</span><span>O</span><span>M</span><span>M</span><span>E</span><span>R</span><span>C</span><span>I</span><span>A</span><span>L</span><span> </span><span>F</span><span>U</span><span>R</span><span>N</span><span>I</span><span>T</span><span>U</span><span>R</span><span>E</span></div>
    </header>

    <!-- MOBILE LOGO BAR -->
    <div class="mobile-logo-bar">
        <div class="mobile-logo-text">MODULAR COMMERCIAL FURNITURE</div>
    </div>

    <div class="menu-modal" id="menuModal">
        <div class="menu-content">
            <a href="index-en.html">Home</a>
            <a href="index-en.html#projects">Approach</a>
            <a href="index-en.html#about">Uses</a>
            <a href="index-en.html#value">Value</a>
            <a href="index-en.html#gallery">Gallery</a>
            <a href="contact-en.html">Contact</a>
            <div class="language-switcher">
                <a href="contact.html" class="lang-fr">FR</a>
                <a href="contact-en.html" class="lang-en active">EN</a>
            </div>
        </div>
    </div>

    <main>
        <div class="container">
            <h1>Get in <span style="color: #083335;">touch</span></h1>

            <p class="contact-intro">Have questions about our modular furniture solutions? Feel free to reach out. We'll get back to you within 48 hours.</p>

            <form id="contactForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send</button>
            </form>
        </div>
    </main>

    <footer>
        <a href="contact-en.html">Contact</a>
        <p>© 2026 Modular Commercial Furniture Design.</p>
    </footer>

    <script>
        const burger = document.getElementById('burger');
        const menuModal = document.getElementById('menuModal');
        const logo = document.getElementById('logo');

        burger.addEventListener('click', () => {
            burger.classList.toggle('active');
            menuModal.classList.toggle('active');
        });

        const menuLinks = menuModal.querySelectorAll('.menu-content a');
        menuLinks.forEach(link => {
            link.addEventListener('click', () => {
                burger.classList.remove('active');
                menuModal.classList.remove('active');
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menuModal.classList.contains('active')) {
                burger.classList.remove('active');
                menuModal.classList.remove('active');
            }
        });

        logo.style.cursor = 'pointer';
        logo.addEventListener('click', () => {
            window.location.href = 'index-en.html';
        });

        // EmailJS Configuration
        emailjs.init('YOUR_PUBLIC_KEY'); // Replace with your EmailJS public key

        const form = document.getElementById('contactForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const templateParams = {
                to_email: 'your-email@example.com', // Replace with your email
                from_name: document.getElementById('firstName').value + ' ' + document.getElementById('lastName').value,
                from_email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                message: document.getElementById('message').value
            };

            try {
                const response = await emailjs.send(
                    'SERVICE_ID', // Replace
                    'TEMPLATE_ID', // Replace
                    templateParams
                );
                console.log('Email sent!', response.status);
                alert('Thank you for your message! We will get back to you soon.');
                form.reset();
            } catch (error) {
                console.error('Error:', error);
                alert('Error sending message. Please try again.');
            }
        });
    </script>

</body>
</html>
